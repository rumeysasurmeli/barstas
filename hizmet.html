<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BarsTaş Yapı taş duvar, taş ev, duvar kaplama, kayrak taşı, mermer ve andezit uygulamaları.">
  <title>Hizmetlerimiz | BarsTaş Yapı</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="hizmet.js" defer></script>
  <style>
    .detail-page {
      width: min(1120px, 92%);
      margin: 0 auto;
      padding: 40px 0 70px;
    }
    .detail-breadcrumb {
      margin-bottom: 24px;
      color: #777;
      font-size: 14px;
    }
    .detail-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }
    .detail-hero img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .detail-copy h1 {
      font-size: clamp(32px, 5vw, 52px);
      margin: 0 0 18px;
    }
    .detail-copy p {
      line-height: 1.8;
    }
    .detail-contact {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      background: #d5a52f;
      color: #171717;
      text-decoration: none;
      font-weight: 700;
      border-radius: 5px;
    }
    .gallery-section {
      margin-top: 55px;
    }
    .gallery-section h2 {
      margin-bottom: 22px;
    }
    #category-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    #category-gallery figure {
      margin: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #f4f1eb;
    }
    #category-gallery img {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    #category-gallery figcaption {
      padding: 12px;
      font-size: 14px;
    }
    @media (max-width: 700px) {
      .detail-hero {
        grid-template-columns: 1fr;
      }
      .detail-hero img {
        height: 280px;
      }
      #category-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      #category-gallery img {
        height: 170px;
      }
    }
    @media (max-width: 420px) {
      #category-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="detail-page">
    <nav class="detail-breadcrumb">
      <a href="index.html">Ana Sayfa</a> / <span id="breadcrumb-title">Hizmetlerimiz</span>
    </nav>

    <section class="detail-hero">
      <div class="detail-copy">
        <h1 id="category-title">Hizmetlerimiz</h1>
        <p id="category-subtitle">BarsTaş Yapı uygulamalarını keşfedin.</p>
        <p id="category-description"></p>
        <a class="detail-contact" id="category-quote" href="https://wa.me/905300610369">
          Teklif Almak İçin İletişime Geçin
        </a>
      </div>
      <img id="category-cover" src="images/tasduvar/tasduvarkapak.jpg" alt="BarsTaş Yapı uygulaması">
    </section>

    <section class="gallery-section">
      <h2 id="gallery-title">Uygulamalarımız</h2>
      <div id="category-gallery">
        <p>Fotoğraflar yükleniyor...</p>
      </div>
    </section>
  </main>
</body>
</html>
